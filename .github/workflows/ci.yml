name: LabGuide Studio CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-windows:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit test suite (strict warnings)
        run: |
          python -W error::DeprecationWarning -W error::ResourceWarning -m unittest discover -s tests -v

      - name: Run clean-room brand check
        shell: pwsh
        run: |
          python -c "from pathlib import Path; import re; pat = re.compile(r'(?<![a-z])scribe|local_scribe|local-scribe', re.I); hits = [f'{p}:{i}' for p in Path('.').rglob('*') if p.is_file() and p.suffix.lower() in {'.py','.md','.ps1','.html','.css','.js','.json','.yml','.cmd','.bat'} and 'sessions' not in p.parts and 'workflows' not in p.parts for i, l in enumerate(p.read_text(encoding='utf-8', errors='replace').splitlines(), 1) if pat.search(l)]; print('Hits:', len(hits), hits); assert not hits"
